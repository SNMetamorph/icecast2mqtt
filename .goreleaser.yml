version: 2

project_name: icecast2mqtt

builds:
  - id: app
    main: ./cmd/app
    binary: icecast2mqtt
    env:
      - CGO_ENABLED=0
    ldflags:
      # Disable embedding debug information
      - -s -w
      # Propage build information to compiling stage
      - -X icecast2mqtt/internal/buildinfo.Version={{.Version}}
      - -X icecast2mqtt/internal/buildinfo.Commit={{.ShortCommit}}
      - -X icecast2mqtt/internal/buildinfo.Date={{.Date}}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

dockers:
  - image_templates:
      - "ghcr.io/SNMetamorph/icecast2mqtt:{{ .Version }}"
      - "ghcr.io/SNMetamorph/icecast2mqtt:latest"
    dockerfile: Dockerfile.release
    use: docker
    goos: linux
    goarch: amd64
    extra_files:
      - config.schema.json
      - config.json.example

archives:
  - formats: [tar.gz, zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - config.json.example
      - config.schema.json

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ .Tag }}'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: true